name: Deploy Static Demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'chat-app/package-lock.json'

      # Temporary: demo.lavinmq.com redirects to lavinmq.com.
      # To restore the demos, replace this step with `npm run deploy`.
      - name: Build redirect page
        run: node scripts/prepare-redirect.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: demo.lavinmq.com
